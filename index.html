<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Mitsva de Raphaël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2e;--bg2:#13263f;--gold:#d4b06a;--gold2:#f0d9a0;--ivory:#f7f1e3;--muted:#a9b4c4}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ivory);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
.serif{font-family:'Cormorant Garamond',serif}

/* ---------- Enveloppe ---------- */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#1a3354 0,var(--bg) 70%);transition:opacity .9s ease,visibility .9s}
#intro.gone{opacity:0;visibility:hidden}
.bsd{font-family:'Cormorant Garamond',serif;color:var(--gold);letter-spacing:.2em;font-size:1rem}
.for{font-size:.75rem;letter-spacing:.35em;text-transform:uppercase;color:var(--muted)}
.guest{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,6vw,2.8rem);font-weight:500;color:var(--gold2)}
.envelope{width:min(300px,78vw);aspect-ratio:3/2;position:relative;cursor:pointer;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45));transition:transform .4s}
.envelope:hover{transform:translateY(-4px)}
.envelope .body{position:absolute;inset:0;background:linear-gradient(160deg,#f3e9d0,#e3d3ac);border-radius:6px}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(180deg,#ead9ae,#d9c590);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;border-radius:6px 6px 0 0}
.envelope .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e8c97f,#a9833a);display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:#4a3410;z-index:2;transition:opacity .4s}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
.btn{font-family:'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;font-size:.78rem;color:var(--bg);background:var(--gold);border:0;padding:15px 34px;border-radius:2px;cursor:pointer;transition:background .3s}
.btn:hover{background:var(--gold2)}

/* ---------- Page ---------- */
main{opacity:0;transition:opacity 1.2s ease .3s}
main.show{opacity:1}
section{padding:90px 24px;text-align:center;max-width:760px;margin:0 auto}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;max-width:none;
  background:radial-gradient(ellipse at 50% 0,#1d3a62 0,var(--bg) 65%)}
.star{width:54px;height:54px;color:var(--gold)}
.eyebrow{font-size:.78rem;letter-spacing:.45em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(3.6rem,15vw,8rem);line-height:.95;color:var(--ivory)}
h1 em{display:block;font-style:italic;font-weight:400;color:var(--gold2);font-size:.42em;letter-spacing:.08em;margin-bottom:.15em}
.date{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,4vw,1.9rem);letter-spacing:.08em}
.line{width:70px;height:1px;background:var(--gold);margin:6px auto}
.count{display:flex;gap:clamp(14px,4vw,34px);justify-content:center;margin-top:14px}
.count div{min-width:64px}
.count b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2rem,7vw,3rem);color:var(--gold2)}
.count span{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.scroll{margin-top:30px;color:var(--muted);font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;text-decoration:none}
.scroll::after{content:"";display:block;width:1px;height:38px;background:var(--gold);margin:12px auto 0}

h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2rem,6vw,3rem);margin-bottom:22px}
.lead{color:var(--muted);font-size:1.05rem;line-height:1.8;max-width:560px;margin:0 auto}
.lead strong{color:var(--ivory);font-weight:400}
.cards{display:grid;gap:18px;margin-top:34px}
.card{background:var(--bg2);border:1px solid rgba(212,176,106,.25);border-radius:4px;padding:30px 22px}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.7rem;color:var(--gold2);margin-bottom:8px}
.card p{color:var(--muted);line-height:1.7}
.card .when{color:var(--ivory);font-size:1.05rem;margin-bottom:6px}
.card a{display:inline-block;margin-top:14px;color:var(--gold);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:3px}
footer{padding:50px 24px 70px;text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ============ À MODIFIER ============ -->
<script>
const CONFIG = {
  garcon: "Raphaël",
  famille: "NOM DE FAMILLE",          // ← à remplir
  parents: "Sandrine et Fabrice",
  dateISO: "2027-01-01T11:00:00",     // ← date et heure de la cérémonie
  dateTexte: "Date à confirmer",      // ← ex. « Samedi 12 décembre 2026 »
  hebreu: "",                          // ← date hébraïque (facultatif)
  evenements: [
    {titre:"La Cérémonie", quand:"Date et heure à confirmer", lieu:"Synagogue — adresse à confirmer", waze:""},
    {titre:"La Réception", quand:"Date et heure à confirmer", lieu:"Lieu — adresse à confirmer", waze:""}
  ]
};
// Invité affiché (sera lu depuis le lien personnel de chaque invité)
const params = new URLSearchParams(location.search);
const GUEST = params.get("invite") || "Prénom(s) NOM";
</script>
<!-- ================================== -->

<div id="intro">
  <div class="bsd">בס״ד</div>
  <div class="for">Invitation pour</div>
  <div class="guest" id="guestName"></div>
  <div class="envelope" id="env" role="button" tabindex="0" aria-label="Ouvrir l'invitation">
    <div class="body"></div><div class="flap"></div><div class="seal">ר</div>
  </div>
  <button class="btn" id="openBtn">Ouvrir l'invitation</button>
</div>

<main id="main">
  <section class="hero">
    <div class="bsd">בס״ד</div>
    <svg class="star" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="50,8 88,72 12,72"/><polygon points="50,92 12,28 88,28"/></svg>
    <div class="eyebrow">Bar Mitsva</div>
    <h1><em>de</em><span id="heroName"></span></h1>
    <div class="line"></div>
    <div class="date" id="heroDate"></div>
    <div class="count" id="count"></div>
    <a class="scroll" href="#infos">Découvrir</a>
  </section>

  <section id="infos">
    <h2>Chers <span id="guestInline"></span>,</h2>
    <p class="lead"><strong id="parents"></strong> ont la joie de vous convier au <strong>Bar Mitsva de leur fils <span id="son"></span></strong>.<br><br>Votre présence rendra ce jour encore plus précieux.</p>
    <div class="cards" id="cards"></div>
  </section>

  <footer>Raphaël · <span id="fam"></span></footer>
</main>

<script>
const $ = id => document.getElementById(id);
$("guestName").textContent = GUEST;
$("guestInline").textContent = GUEST;
$("heroName").textContent = CONFIG.garcon;
$("son").textContent = CONFIG.garcon;
$("parents").textContent = CONFIG.parents;
$("fam").textContent = CONFIG.famille;
$("heroDate").textContent = CONFIG.dateTexte + (CONFIG.hebreu ? " · " + CONFIG.hebreu : "");

$("cards").innerHTML = CONFIG.evenements.map(e => `
  <div class="card">
    <h3>${e.titre}</h3>
    <p class="when">${e.quand}</p>
    <p>${e.lieu}</p>
    ${e.waze ? `<a href="${e.waze}" target="_blank" rel="noopener">Ouvrir dans Waze</a>` : ""}
  </div>`).join("");

function open_(){
  $("env").classList.add("open");
  setTimeout(()=>{ $("intro").classList.add("gone"); $("main").classList.add("show"); }, 700);
}
$("openBtn").onclick = open_;
$("env").onclick = open_;
$("env").onkeydown = e => { if(e.key==="Enter"||e.key===" ") open_(); };

function tick(){
  let d = new Date(CONFIG.dateISO) - new Date();
  if(d < 0) d = 0;
  const j = Math.floor(d/864e5), h = Math.floor(d%864e5/36e5), m = Math.floor(d%36e5/6e4), s = Math.floor(d%6e4/1e3);
  const p = n => String(n).padStart(2,"0");
  $("count").innerHTML = [[j,"Jours"],[h,"Heures"],[m,"Min"],[s,"Sec"]].map(([v,l])=>`<div><b>${p(v)}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
