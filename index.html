<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Mitsva de Raphaël</title>
<meta name="description" content="Vous êtes invités au Bar Mitsva de Raphaël.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ivory:#faf6ee; --ink:#1c1b19; --muted:#7a7468;
  --gold:#b8935a; --gold-soft:#e6d3ae; --line:#e9e2d3;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.serif{font-family:'Cormorant Garamond',serif}
body.locked{overflow:hidden}

/* ================= INTRO : ENVELOPPE ================= */
#intro{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:24px;text-align:center;transition:opacity 1s ease,visibility 1s}
#intro.gone{opacity:0;visibility:hidden}
.bsd{font-family:'Cormorant Garamond',serif;color:var(--gold);letter-spacing:.3em;font-size:1rem}
.for{font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--muted)}
.guest{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.9rem,6vw,2.9rem);font-weight:500;color:var(--ink);margin-top:-18px}

.scene{perspective:1400px;width:min(380px,84vw);aspect-ratio:3/2.15;position:relative;cursor:pointer;margin-top:30px}
.env{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.6,.05,.2,1)}
.env-back{position:absolute;inset:0;background:linear-gradient(160deg,#efe4cc,#e4d5b4);border-radius:5px;box-shadow:0 30px 60px -20px rgba(80,60,20,.35),0 2px 6px rgba(80,60,20,.12)}
/* carte qui sort */
.card{position:absolute;left:6%;right:6%;top:7%;bottom:6%;background:var(--paper);border:1px solid var(--line);border-radius:3px;box-shadow:0 8px 24px rgba(60,45,15,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  transform:translateY(0);transition:transform 1.4s cubic-bezier(.5,.05,.2,1) .9s;z-index:2}
.card::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);border-radius:2px}
.card .cic svg{width:26px;height:26px;color:var(--gold)}
.card small{font-size:.5rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.card b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(1.4rem,5.2vw,2rem);color:var(--ink)}
.card i{font-family:'Cormorant Garamond',serif;font-size:.85rem;color:var(--muted)}
/* poche avant : côtés + bas (tout sauf le triangle du haut) */
.env-front{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:5px;background:#e6d6b3;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.env-front::before,.env-front::after{content:"";position:absolute;inset:0}
.env-front::before{background:linear-gradient(135deg,#f2e8d0,#e8d9b9);clip-path:polygon(0 0,50% 52%,0 100%)}
.env-front::after{background:linear-gradient(225deg,#f2e8d0,#e8d9b9);clip-path:polygon(100% 0,50% 52%,100% 100%)}
/* rabat */
.flap{position:absolute;left:0;right:0;top:0;height:52%;z-index:4;transform-origin:top center;transition:transform .9s cubic-bezier(.5,0,.2,1) .1s,z-index 0s .55s;
  background:linear-gradient(180deg,#ecdfbf,#dfcea6);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:5px 5px 0 0}
.seal{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;z-index:5;
  background:radial-gradient(circle at 35% 30%,#e3c58b,#a37c3c);display:grid;place-items:center;
  font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:#fff8e6;box-shadow:0 4px 10px rgba(70,50,10,.35);transition:opacity .35s}
.scene.open .flap{transform:rotateX(180deg);z-index:1}
.scene.open .seal{opacity:0}
.scene.open .card{transform:translateY(-64%) scale(1.06)}
.scene.open .env{transform:translateY(46px)}
.scene:hover:not(.open) .env{transform:translateY(-4px) rotate(-.6deg)}
.btn{font-family:'Jost',sans-serif;letter-spacing:.32em;text-transform:uppercase;font-size:.72rem;color:#fff;background:var(--ink);border:0;padding:16px 36px;border-radius:2px;cursor:pointer;transition:background .3s,opacity .4s}
.btn:hover{background:var(--gold)}
#intro.opening .btn{opacity:0;pointer-events:none}
#intro .for,#intro .guest,#intro .bsd{transition:opacity .7s ease}
#intro.opening .for,#intro.opening .guest,#intro.opening .bsd{opacity:0}

/* ================= PAGE ================= */
main{opacity:0;transition:opacity 1.4s ease .2s}
main.show{opacity:1}
section{padding:96px 24px;text-align:center;max-width:780px;margin:0 auto}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;max-width:none;position:relative;background:linear-gradient(180deg,#fff 0,var(--ivory) 100%)}
.frame{position:absolute;inset:22px;border:1px solid var(--gold-soft);pointer-events:none}
.frame::after{content:"";position:absolute;inset:7px;border:1px solid var(--line)}
.star{width:46px;height:46px;color:var(--gold)}
.eyebrow{font-size:.74rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(3.8rem,16vw,8.5rem);line-height:.95;color:var(--ink)}
h1 em{display:block;font-style:italic;font-weight:400;color:var(--gold);font-size:.4em;letter-spacing:.06em;margin-bottom:.2em}
.line{width:64px;height:1px;background:var(--gold);margin:8px auto}
.date{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,4vw,1.9rem);letter-spacing:.08em;color:var(--ink)}
.heb{font-size:.9rem;color:var(--muted);letter-spacing:.1em}
.count{display:flex;gap:clamp(14px,4vw,36px);justify-content:center;margin-top:16px}
.count div{min-width:62px}
.count b{display:block;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2rem,7vw,3rem);color:var(--ink)}
.count span{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.scroll{margin-top:30px;color:var(--muted);font-size:.68rem;letter-spacing:.38em;text-transform:uppercase;text-decoration:none}
.scroll::after{content:"";display:block;width:1px;height:40px;background:var(--gold);margin:12px auto 0}

h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:clamp(2rem,6vw,3rem);margin-bottom:24px;color:var(--ink)}
.lead{color:var(--muted);font-size:1.05rem;line-height:1.9;max-width:560px;margin:0 auto}
.lead strong{color:var(--ink);font-weight:400}
.cards{display:grid;gap:20px;margin-top:40px}
.ev{background:var(--paper);border:1px solid var(--line);padding:34px 22px;position:relative}
.ev::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-soft);opacity:.7;pointer-events:none}
.ev h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.8rem;color:var(--ink);margin-bottom:10px}
.ev .when{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;margin-bottom:10px}
.ev p{color:var(--muted);line-height:1.7}
.ev a{display:inline-block;margin-top:16px;color:var(--ink);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:3px}
.ev a:hover{color:var(--gold)}
.icons{display:flex;gap:26px;justify-content:center;color:var(--gold);margin:6px 0 2px}
.icons svg{width:38px;height:38px;opacity:.9}
.ev .ic{width:46px;height:46px;color:var(--gold);margin:0 auto 12px;display:block}
.ev .detail{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--ink);margin-bottom:8px}
.ev .jour{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--ink)}
footer{padding:50px 24px 80px;text-align:center;color:var(--muted);font-size:.72rem;letter-spacing:.35em;text-transform:uppercase;border-top:1px solid var(--line);max-width:780px;margin:0 auto}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body class="locked">

<!-- ============ À MODIFIER ============ -->
<script>
const CONFIG = {
  garcon: "Raphaël",
  famille: "",                           // ← nom de famille (facultatif)
  parents: "Sandrine et Fabrice",
  dateISO: "2027-05-03T08:30:00",       // compte à rebours : mise des tefilines
  dateTexte: "3 mai & 30 mai 2027",
  hebreu: "",                            // ← date hébraïque (facultatif)
  evenements: [
    {icone:"tefilines", titre:"Mise des Tefilines", jour:"Lundi 3 mai 2027", heure:"8h30",
     detail:"Suivie d'un petit déjeuner",
     lieu:"14, allée des Rouges-Gorges<br>95350 Saint-Brice-sous-Forêt",
     waze:"https://waze.com/ul?q=14%20all%C3%A9e%20des%20Rouges-Gorges%2095350%20Saint-Brice-sous-For%C3%AAt&navigate=yes"},
    {icone:"torah", titre:"La Fête", jour:"Dimanche 30 mai 2027", heure:"À partir de 12h30",
     detail:"",
     lieu:"Centre communautaire Berechit<br>Avenue Paul Valéry<br>95200 Sarcelles",
     waze:"https://waze.com/ul?q=Centre%20communautaire%20Berechit%20Avenue%20Paul%20Val%C3%A9ry%2095200%20Sarcelles&navigate=yes"}
  ]
};
// Petits dessins (traits dorés)
const ICONS = {
  tefilines:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="8" width="20" height="20" rx="2"/><rect x="27" y="13" width="10" height="10" rx="1"/><path d="M26 28c-2 8-8 12-8 22M38 28c2 8 8 12 8 22M18 50l-3 6M46 50l3 6M30 28v10m4-10v10"/></svg>`,
  torah:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 8l3-3 3 3 4-4 4 4 3-3 3 3"/><rect x="14" y="12" width="6" height="42" rx="3"/><rect x="44" y="12" width="6" height="42" rx="3"/><path d="M20 16h24M20 50h24M26 24h12M26 30h12M26 36h12M26 42h12"/></svg>`,
  synagogue:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 56h48M12 56V28l20-16 20 16v28"/><path d="M26 56V42a6 6 0 0 1 12 0v14"/><path d="M32 18l-4 7h8zM32 30l4-7h-8z" stroke-width="1.6"/><path d="M4 56V36l6-5M60 56V36l-6-5"/></svg>`
};
const params = new URLSearchParams(location.search);
const GUEST = params.get("invite") || "Prénom(s) NOM";
</script>
<!-- ================================== -->

<div id="intro">
  <div class="bsd">בס״ד</div>
  <div class="for">Invitation pour</div>
  <div class="guest" id="guestName"></div>

  <div class="scene" id="scene" role="button" tabindex="0" aria-label="Ouvrir l'invitation">
    <div class="env">
      <div class="env-back"></div>
      <div class="card">
        <span class="cic" id="cardIcon"></span>
        <small>Bar Mitsva</small>
        <b id="cardName"></b>
        <i>Vous êtes invités</i>
      </div>
      <div class="env-front"></div>
            <div class="flap"></div>
      <div class="seal">ר</div>
    </div>
  </div>

  <button class="btn" id="openBtn">Ouvrir l'invitation</button>
</div>

<main id="main">
  <section class="hero">
    <div class="frame"></div>
    <div class="bsd">בס״ד</div>
    <div class="icons" id="heroIcons"></div>
    <div class="eyebrow">Bar Mitsva</div>
    <h1><em>de</em><span id="heroName"></span></h1>
    <div class="line"></div>
    <div class="date" id="heroDate"></div>
    <div class="heb" id="heroHeb"></div>
    <div class="count" id="count"></div>
    <a class="scroll" href="#infos">Découvrir</a>
  </section>

  <section id="infos">
    <h2>Chers <span id="guestInline"></span>,</h2>
    <p class="lead"><strong id="parents"></strong> ont la joie de vous convier au <strong>Bar Mitsva de leur fils <span id="son"></span></strong>.<br><br>Votre présence rendra ce jour encore plus précieux.</p>
    <div class="cards" id="cards"></div>
  </section>

  <footer><span id="sonFoot"></span><span id="fam"></span></footer>
</main>

<script>
const $ = id => document.getElementById(id);
$("guestName").textContent = GUEST;
$("guestInline").textContent = GUEST;
$("cardName").textContent = CONFIG.garcon;
$("heroName").textContent = CONFIG.garcon;
$("son").textContent = CONFIG.garcon;
$("sonFoot").textContent = CONFIG.garcon;
$("parents").textContent = CONFIG.parents;
$("fam").textContent = CONFIG.famille ? " · " + CONFIG.famille : "";
$("heroDate").textContent = CONFIG.dateTexte;
$("heroHeb").textContent = CONFIG.hebreu;

$("cardIcon").innerHTML = ICONS.tefilines;
$("heroIcons").innerHTML = ICONS.tefilines + ICONS.synagogue + ICONS.torah;
$("cards").innerHTML = CONFIG.evenements.map(e => `
  <div class="ev">
    <span class="ic">${ICONS[e.icone]||""}</span>
    <h3>${e.titre}</h3>
    <p class="jour">${e.jour}</p>
    <p class="when">${e.heure}</p>
    ${e.detail ? `<p class="detail">${e.detail}</p>` : ""}
    <p>${e.lieu}</p>
    ${e.waze ? `<a href="${e.waze}" target="_blank" rel="noopener">Ouvrir dans Waze</a>` : ""}
  </div>`).join("");

let opened = false;
function openInvite(){
  if(opened) return; opened = true;
  $("intro").classList.add("opening");
  $("scene").classList.add("open");
  // l'enveloppe s'ouvre, la carte sort, puis la page apparaît
  setTimeout(()=>{ $("intro").classList.add("gone"); document.body.classList.remove("locked"); $("main").classList.add("show"); window.scrollTo(0,0); }, 3900);
}
$("openBtn").onclick = openInvite;
$("scene").onclick = openInvite;
$("scene").onkeydown = e => { if(e.key==="Enter"||e.key===" ") openInvite(); };

function tick(){
  let d = new Date(CONFIG.dateISO) - new Date();
  if(d < 0) d = 0;
  const j = Math.floor(d/864e5), h = Math.floor(d%864e5/36e5), m = Math.floor(d%36e5/6e4), s = Math.floor(d%6e4/1e3);
  const p = n => String(n).padStart(2,"0");
  $("count").innerHTML = [[j,"Jours"],[h,"Heures"],[m,"Min"],[s,"Sec"]].map(([v,l])=>`<div><b>${p(v)}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
